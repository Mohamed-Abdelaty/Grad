name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t platform-backend backend/
      - name: Run unit tests inside container
        run: docker run --rm platform-backend pytest -q -m "not integration" -rs
      - name: Setup Python for formatting check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install black ruff
      - name: Run Black check
        run: black --check backend/ spark-jobs/
      - name: Run Ruff check
        run: ruff check backend/ spark-jobs/

  repo-root-tests:
    name: Repo Root & Compose Consistency Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Verify Compose consistency
        run: pytest backend/tests/test_config.py -k test_compose_project_name_is_consistent -q

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit & Component Tests
        run: npm run test
      - name: Build Production Assets
        run: npm run build
      - name: Generate and upload bundle size report
        run: |
          mkdir -p ../bundle-report
          ls -la dist/assets > ../bundle-report/chunk-sizes.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: bundle-report/chunk-sizes.txt

  security:
    name: Security Audits & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node dependency audit (production dependencies)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-smoke:
    name: Playwright E2E Smoke & Screenshots (Manual Trigger)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: |
          pwsh ./scripts/setup-env.ps1
      - name: Start Docker Stack
        run: docker compose up -d --build
      - name: Wait for Stack Health
        run: |
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend healthy!"
              break
            fi
            echo "Waiting for cluster... attempt $i/60"
            sleep 5
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright E2E Suite
        run: |
          cd frontend
          E2E_USERNAME=$(grep '^ADMIN_USERNAME=' ../.env | cut -d '=' -f2)
          E2E_PASSWORD=$(grep '^ADMIN_PASSWORD=' ../.env | cut -d '=' -f2)
          export E2E_USERNAME E2E_PASSWORD
          npx playwright test e2e/smoke.spec.ts e2e/polish.spec.ts e2e/bundle.spec.ts
      - name: Upload Playwright Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            docs/screenshots/
      - name: Teardown Stack
        if: always()
        run: docker compose down -v
