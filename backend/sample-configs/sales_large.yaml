pipeline:
  name: sales-large
  version: "1.0"
source:
  type: csv
  path: /app/sample-data/sales_large.csv
schema:
  - { name: transaction_id, type: string }
  - { name: customer_id, type: string }
  - { name: product_id, type: string }
  - { name: amount, type: double }
  - { name: timestamp, type: timestamp }
processing:
  operations:
    - { type: remove_nulls }
    - { type: remove_duplicates }
    - { type: filter, condition: "amount > 0" }
streaming:
  enabled: false
messaging:
  broker: kafka
  topic: sales-large
processing_engine:
  type: spark
storage:
  type: hdfs
  path: /data/sales_large
monitoring:
  enabled: true
